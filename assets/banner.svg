<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="LLM Training Debugger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="55%" stop-color="#101826"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#79c0ff"/><stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1f2937" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <g transform="translate(70,74)">
    <circle cx="7" cy="7" r="7" fill="#3fb950" filter="url(#glow)"/>
    <text x="26" y="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8b949e" letter-spacing="1.5">EVIDENCE-FIRST TRAINING MONITOR</text>
  </g>

  <text x="70" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#e6edf3">LLM Training <tspan fill="#58a6ff">Debugger</tspan></text>

  <text x="70" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8b949e">Turns metric anomalies into audit-ready incidents.</text>
  <text x="70" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8b949e">Abstains when the evidence does not support a claim.</text>

  <g transform="translate(70,262)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <rect x="0" y="-17" width="118" height="30" rx="15" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-opacity="0.55"/>
    <text x="59" y="3" fill="#79c0ff" text-anchor="middle">metric</text>
    <text x="132" y="3" fill="#484f58">&#8594;</text>
    <rect x="156" y="-17" width="118" height="30" rx="15" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-opacity="0.55"/>
    <text x="215" y="3" fill="#79c0ff" text-anchor="middle">anomaly</text>
    <text x="288" y="3" fill="#484f58">&#8594;</text>
    <rect x="312" y="-17" width="118" height="30" rx="15" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-opacity="0.55"/>
    <text x="371" y="3" fill="#79c0ff" text-anchor="middle">evidence</text>
    <text x="444" y="3" fill="#484f58">&#8594;</text>
    <rect x="468" y="-17" width="118" height="30" rx="15" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.55"/>
    <text x="527" y="3" fill="#56d364" text-anchor="middle">incident</text>
    <text x="600" y="3" fill="#484f58">&#8594;</text>
    <rect x="624" y="-17" width="230" height="30" rx="15" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-opacity="0.5"/>
    <text x="739" y="3" fill="#e3b341" text-anchor="middle">earliest defensible event</text>
  </g>

  <g transform="translate(900,120)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="0" y="0" width="230" height="140" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="32" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b949e">pytest</text>
    <text x="20" y="62" font-size="30" font-weight="700" fill="#3fb950">584</text>
    <text x="105" y="62" font-size="15" fill="#8b949e">passing</text>
    <line x1="20" y1="80" x2="210" y2="80" stroke="#30363d"/>
    <text x="20" y="104" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b949e">version</text>
    <text x="20" y="128" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#79c0ff">v0.1.7-alpha</text>
  </g>
</svg>
