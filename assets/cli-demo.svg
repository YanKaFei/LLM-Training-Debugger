<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="CLI demo">
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .k { fill: #79c0ff; } .g { fill: #56d364; } .y { fill: #e3b341; }
      .d { fill: #8b949e; } .w { fill: #e6edf3; } .r { fill: #f85149; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="42" rx="10" fill="#161b22"/>
  <rect x="0" y="30" width="1200" height="12" fill="#161b22"/>
  <circle cx="26" cy="21" r="6" fill="#f85149"/><circle cx="48" cy="21" r="6" fill="#d29922"/><circle cx="70" cy="21" r="6" fill="#3fb950"/>
  <text x="600" y="26" class="m" font-size="12.5" fill="#8b949e" text-anchor="middle">training-debugger &#8212; compare</text>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#30363d"/>

  <g class="m" font-size="13.5">
    <text x="28" y="76" class="d">$</text>
    <text x="46" y="76" class="k">training-debugger</text>
    <text x="196" y="76" class="w">--root ./runs compare baseline_run suspect_run</text>

    <text x="28" y="118" class="w" font-size="15">RUN DIVERGENCE</text>

    <text x="28" y="152" class="d">A: baseline_run</text>
    <text x="28" y="174" class="d">B: suspect_run</text>
    <text x="28" y="196" class="d">common steps: 150   metrics compared: 10</text>

    <text x="28" y="238" class="y" font-size="15">FIRST DIVERGENCE: step 90  metric grad.global_norm</text>

    <text x="48" y="268" class="w">A = 0.450342    B = 67.5513    difference = +67.1</text>
    <text x="48" y="290" class="d">6200.9x the agreement scale, sustained for 61 step(s)</text>

    <text x="28" y="330" class="d">per-metric pivots</text>
    <text x="48" y="354" class="w">step 90     grad.global_norm              +67.1</text>
    <text x="48" y="376" class="w">step 90     grad.layer_norm               +64.2</text>
    <text x="48" y="398" class="w">step 91     train.loss                    +0.7754</text>
    <text x="48" y="420" class="w">step 93     param.global_norm             +2.773</text>

    <text x="28" y="462" class="d">runs agree for the first 30 steps and first depart at step 90 on</text>
    <text x="28" y="482" class="d">grad.global_norm. This is a pivot for investigation,</text>
    <text x="28" y="502" class="d">NOT a root cause: it names a step and a metric, not a kernel</text>
    <text x="28" y="522" class="d">or a tensor.</text>
  </g>
</svg>
