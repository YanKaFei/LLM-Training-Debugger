<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Verdicts">
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#484f58"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#0d1117"/>
  <text x="40" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Verdicts</text>
  <text x="40" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Three of the four outcomes are not "something is wrong". That is the point.</text>

  <!-- inputs -->
  <rect x="40" y="108" width="200" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="140" font-family="-apple-system,sans-serif" font-size="13" fill="#8b949e">observations</text>
  <text x="60" y="166" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#79c0ff">OBSERVED evidence</text>

  <line x1="240" y1="148" x2="300" y2="148" stroke="#484f58" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- verdict cards -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="310" y="108" width="270" height="112" rx="10" fill="#0f2417" stroke="#3fb950"/>
    <text x="332" y="140" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600" fill="#56d364">CONFIRMED_INCIDENT</text>
    <text x="332" y="170" font-size="13" fill="#8b949e">Observed, corroborated, and</text>
    <text x="332" y="192" font-size="13" fill="#8b949e">promoted by a rule that cites</text>
    <text x="332" y="212" font-size="13" fill="#484f58">its own evidence.</text>

    <rect x="604" y="108" width="270" height="112" rx="10" fill="#241d0f" stroke="#d29922"/>
    <text x="626" y="140" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600" fill="#e3b341">CANDIDATE_ONLY</text>
    <text x="626" y="170" font-size="13" fill="#8b949e">Real signal, but the capability</text>
    <text x="626" y="192" font-size="13" fill="#8b949e">that would confirm it is not</text>
    <text x="626" y="212" font-size="13" fill="#484f58">enabled, or not yet recalled.</text>

    <rect x="898" y="108" width="262" height="112" rx="10" fill="#1c1f26" stroke="#8b949e"/>
    <text x="920" y="140" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600" fill="#c9d1d9">INSUFFICIENT_EVIDENCE</text>
    <text x="920" y="170" font-size="13" fill="#8b949e">Not enough was observed to</text>
    <text x="920" y="192" font-size="13" fill="#8b949e">decide either way. Different</text>
    <text x="920" y="212" font-size="13" fill="#484f58">from "nothing happened".</text>

    <rect x="310" y="248" width="850" height="92" rx="10" fill="#0f1a24" stroke="#1f6feb"/>
    <text x="332" y="280" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600" fill="#79c0ff">NO_ANOMALY</text>
    <text x="332" y="308" font-size="13" fill="#8b949e">The run was watched and nothing crossed a boundary. Carries an evidence-completeness field, so this verdict is</text>
    <text x="332" y="328" font-size="13" fill="#8b949e">qualified the moment any event was dropped, and is never rendered as an unqualified "the run is healthy".</text>
  </g>

  <!-- honesty footer -->
  <rect x="40" y="368" width="1120" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="398" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#8b949e">reason_code &#183; evidence_state &#183; promotion_disposition &#183; data_quality &#183; completeness_warning</text>
  <text x="64" y="424" font-family="-apple-system,sans-serif" font-size="13" fill="#484f58">Every verdict carries why it was reached, so a negative result can be audited rather than trusted.</text>
</svg>
