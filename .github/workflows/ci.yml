name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux wheel bundles CUDA and is >2 GB for a
          # test suite that never touches a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Smoke
        run: python tests/experiments/full_pipeline_smoke.py

      - name: Quickstart
        run: python examples/quickstart.py

  # Allowed to fail, on purpose.
  #
  # `duckdb` carries an upper bound because 1.5.6 breaks `fetch_arrow_table()`.
  # Without this job nobody would notice when upstream fixes it, and the bound
  # would quietly outlive its reason. A red run here is information, not a
  # regression: it means the bound is worth re-testing.
  latest-dependencies:
    name: latest dependencies (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with every upper bound ignored
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install --upgrade duckdb pyarrow numpy
          python -c "import duckdb, pyarrow, numpy; print('duckdb', duckdb.__version__, 'pyarrow', pyarrow.__version__, 'numpy', numpy.__version__)"
      - name: Test
        run: pytest -q

  package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Assert no local paths leaked into the artifacts
        run: |
          mkdir -p /tmp/audit && tar -xzf dist/*.tar.gz -C /tmp/audit
          if grep -rl "/Users/" /tmp/audit/ 2>/dev/null | grep -q .; then
            echo "local path found in sdist"; exit 1
          fi
          echo "artifact audit clean"

  evidence-drift:
    name: evidence provenance (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Every artifact records the revision that produced it, and nothing was reading
      # that until this job existed. A stale artifact is expected between regeneration
      # batches, so this does not fail the build -- it reports. What it DOES fail on is
      # an artifact with no provenance that is not in the frozen ledger, because that
      # means a generator bypassed write_artifact.
      - name: Report drift between committed evidence and HEAD
        run: python tests/experiments/check_evidence_drift.py

  hygiene:
    name: no machine-specific paths in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Committed evidence is regenerated by a documented command, so a generator
      # that writes an absolute path silently re-introduces one on every run. That
      # happened once: a sanitised file came back with `/Users/<name>/...` in it.
      # Fixing the generator is necessary but not sufficient -- this is the guard
      # that does not depend on anyone remembering.
      - name: Scan every tracked file for a home-directory path
        run: |
          # The CI workflow itself legitimately contains the string, as the pattern
          # it searches for.
          hits=$(git grep -lI -e '/Users/' -e '/home/' -e 'C:\\Users' -- . \
                 ':!.github/workflows/ci.yml' || true)
          if [ -n "$hits" ]; then
            echo "machine-specific path found in tracked files:"
            echo "$hits"
            exit 1
          fi
          echo "tracked-file hygiene clean"
