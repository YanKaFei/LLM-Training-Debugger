name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Smoke
        run: python tests/experiments/full_pipeline_smoke.py

      - name: Quickstart
        run: python examples/quickstart.py

  package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Assert no local paths leaked into the artifacts
        run: |
          mkdir -p /tmp/audit && tar -xzf dist/*.tar.gz -C /tmp/audit
          if grep -rl "/Users/" /tmp/audit/ 2>/dev/null | grep -q .; then
            echo "local path found in sdist"; exit 1
          fi
          echo "artifact audit clean"
