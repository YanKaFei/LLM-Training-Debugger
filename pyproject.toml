[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-debugger"
version = "0.1.7a1"
description = "Training observability, incident detection and earliest-abnormal-evidence analysis for LLM training"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.23",
    "pyarrow>=12",
    # Upper bound is deliberate: duckdb 1.5.6 breaks `fetch_arrow_table()` with
    # `SystemError: <built-in function __import__> returned a result with an
    # exception set`. Observed on CI with duckdb 1.5.6 / pyarrow 26.0.0 /
    # numpy 2.5.4 on Python 3.11 and 3.12: 23 failures, all of them in the two
    # storage test modules, all of them at that one call. The 560-odd other tests
    # passed and `import pyarrow` worked, so the fault is in duckdb's Arrow bridge,
    # not in pyarrow.
    #
    # Python 3.9 cannot see it, because duckdb 1.5.x requires Python >= 3.10 and
    # 3.9 resolves to 1.4.5. That is why this was invisible locally and appeared
    # on the first CI run. Anyone on Python 3.10+ with an unpinned install had a
    # broken build, which is why the bound is on the dependency rather than on CI.
    "duckdb>=0.10,<1.5",
]

[project.optional-dependencies]
# The core library (observer, storage, detectors, episodes, fusion, CLI) imports no
# torch. Only the PyTorch adapter does, so it stays optional for users who drive the
# library from their own instrumentation.
torch = ["torch>=2.0"]
# `dev` includes torch on purpose. The test suite imports it in 38 files, so a `dev`
# install without it left six test modules failing at collection -- which is exactly
# what happened on the first CI run. `pip install -e ".[dev]"` must be enough to run
# the tests; anything less is a broken onboarding path.
dev = ["pytest>=7.4", "torch>=2.0"]

[project.scripts]
training-debugger = "training_debugger.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
# A build artefact must not be shipped inside the distribution.
exclude = ["*.egg-info", "*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running benchmarks and 1M-event storage tests",
    "torch: requires PyTorch to be installed",
    "performance: performance gate measurements",
]
filterwarnings = ["error::DeprecationWarning:training_debugger.*"]
