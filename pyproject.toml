[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-debugger"
version = "0.1.7a1"
description = "Training observability, incident detection and earliest-abnormal-evidence analysis for LLM training"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.23",
    "pyarrow>=12",
    "duckdb>=0.10",
]

[project.optional-dependencies]
# The core library (observer, storage, detectors, episodes, fusion, CLI) imports no
# torch. Only the PyTorch adapter does, so it stays optional for users who drive the
# library from their own instrumentation.
torch = ["torch>=2.0"]
# `dev` includes torch on purpose. The test suite imports it in 38 files, so a `dev`
# install without it left six test modules failing at collection -- which is exactly
# what happened on the first CI run. `pip install -e ".[dev]"` must be enough to run
# the tests; anything less is a broken onboarding path.
dev = ["pytest>=7.4", "torch>=2.0"]

[project.scripts]
training-debugger = "training_debugger.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
# A build artefact must not be shipped inside the distribution.
exclude = ["*.egg-info", "*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running benchmarks and 1M-event storage tests",
    "torch: requires PyTorch to be installed",
    "performance: performance gate measurements",
]
filterwarnings = ["error::DeprecationWarning:training_debugger.*"]
